<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldritch Horror Encounter Helper</title>
    <!-- Data -->
    <script src="js/global_variables.js"></script>
    <script src="js/deckdata_america.js"></script>
    <script src="js/deckdata_asia_australia.js"></script>
    <script src="js/deckdata_devestation.js"></script>
    <script src="js/deckdata_dream_quest.js"></script>
    <script src="js/deckdata_dreamlands.js"></script>
    <script src="js/deckdata_europe.js"></script>
    <script src="js/deckdata_expedition.js"></script>
    <script src="js/deckdata_general.js"></script>
    <script src="js/deckdata_mystic_ruins.js"></script>
    <script src="js/deckdata_other_world.js"></script>
    <script src="js/deckdata_research.js"></script>
    <script src="js/deckdata_special.js"></script>
    <!-- Logic -->
    <script defer src="js/index.js"></script>
  </head>
  <body>
    <h1>ELDRITCH HORROR ENCOUNTER HELPER</h1>
    <div id="app"></div>
    <div id="mainView">
      Read America Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'Arkham')">Arkham</button>
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'Buenos Aires')">Buenos Aires</button>
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'San Francisco')">San Francisco</button>
      <br>
      Read Asia/Australia Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Shanghai')">Shanghai</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Sydney')">Sydney</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Tokyo')">Tokyo</button>
      <br>
      Read Europe Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'Istanbul')">Istanbul</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'London')">London</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'Rome')">Rome</button>
      <br>
      Read General Encounter
      <button type="button" class="encounter" onclick="startGeneralEncounter('City')">City</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Wilderness')">Wilderness</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Sea')">Sea</button>
      <br>
      Read Research Encounter
      <button type="button" class="encounter" onclick="startResearchEncounter('City')">City</button>
      <button type="button" class="encounter" onclick="startResearchEncounter('Wilderness')">Wilderness</button>
      <button type="button" class="encounter" onclick="startResearchEncounter('Sea')">Sea</button>
      <br>
      <div id="dreamlands">
        Read Dreamlands Encounter
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Celephaïs')">Celephaïs</button>
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Dylath-Leen')">Dylath-Leen</button>
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Ulthar')">Ulthar</button>
        <div id="dream-quest-buttons">
          <button type="button" onclick="shuffleDreamQuestDeck()">Shuffle the Dream-Quest deck</button>
        </div>
      </div>
      <div id="devestation">
        <button type="button" class="encounter" onclick="startDevestationEncounter()">Read Devestation Encounter</button>
        <br>
      </div>
      <button type="button" class="encounter" onclick="startOtherWorldEncounter()">Read Other World Encounter</button>

      <div id="expedition-buttons">
        <button type="button" onclick="shuffleExpeditionDeck()" id="shuffle-expedition">Shuffle the Expedition deck</button>
        <button type="button" onclick="resolveSecretsOfThePastReckoning()" id="secrets-of-the-past"></button>
      </div>
      <div id="mystic-ruins-buttons">
        <button type="button" onclick="shuffleMysticRuinsDeck()">Shuffle the Mystic Ruins deck</button>
      </div>
      <div id="special-encounters"></div>
    </div>
    <div>
      <h2 id>Encounters</h2>
      <div id="encounterList"></div>
    </div>
  </body>
</html>
