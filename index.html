<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldritch Horror Encounter Helper</title>
  </head>
  <body>
    <h1>ELDRITCH HORROR ENCOUNTER HELPER</h1>
    <div id="app"></div>
    <script src="js/index.js"></script>

    <div id="mainView">
      Read America Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'Arkham')">Arkham</button>
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'Buenos Aires')">Buenos Aires</button>
      <button type="button" class="encounter" onclick="startCityEncounter('America', 'San Francisco')">San Francisco</button>
      <br>
      Read Asia/Australia Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Shanghai')">Shanghai</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Sydney')">Sydney</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Tokyo')">Tokyo</button>
      <br>
      Read Europe Encounter
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'Istanbul')">Istanbul</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'London')">London</button>
      <button type="button" class="encounter" onclick="startCityEncounter('Europe', 'Rome')">Rome</button>
      <br>
      Read General Encounter
      <button type="button" class="encounter" onclick="startGeneralEncounter('City')">City</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Wilderness')">Wilderness</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Sea')">Sea</button>
      <br>
      <button type="button" class="encounter" onclick="startOtherWorldEncounter()">Read Other World Encounter</button>
    </div>
    <div>
      <h2 id>Encounters</h2>
      <div id="encounterList"></div>
    </div>
  </body>
</html>
