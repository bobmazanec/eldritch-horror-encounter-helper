<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldritch Horror Encounter Helper</title>
    <link rel="stylesheet" href="css/index.css">
    <!-- Data -->
    <script src="js/global_variables.js"></script>
    <script src="js/deck.js"></script>
    <script src="js/deckdata_america.js"></script>
    <script src="js/deckdata_asia_australia.js"></script>
    <script src="js/deckdata_devestation.js"></script>
    <script src="js/deckdata_dream_quest.js"></script>
    <script src="js/deckdata_dreamlands.js"></script>
    <script src="js/deckdata_europe.js"></script>
    <script src="js/deckdata_expedition.js"></script>
    <script src="js/deckdata_general.js"></script>
    <script src="js/deckdata_mystic_ruins.js"></script>
    <script src="js/deckdata_other_world.js"></script>
    <script src="js/deckdata_research.js"></script>
    <script src="js/deckdata_special.js"></script>
    <!-- Logic -->
    <script defer src="js/index.js"></script>
  </head>
  <body>
    <h1>ELDRITCH HORROR ENCOUNTER HELPER</h1>
    <div id="app"></div>
    <div id="mainView">
      America
      <div>
        <button type="button" id="arkham" class="encounter" onclick="startCityEncounter('America', 'Arkham')">Start Arkham Encounter</button>
        <button type="button" id="buenos-aires" class="encounter" onclick="startCityEncounter('America', 'Buenos Aires')">Start Buenos Aires Encounter</button>
        <button type="button" id="san-francisco" class="encounter" onclick="startCityEncounter('America', 'San Francisco')">Start San Francisco Encounter</button>
      </div>
      <div class="disaster">
        <button type="button" onclick="devestateCity(event, 'Arkham')">Devestate Arkham</button>
        <button type="button" onclick="devestateCity(event, 'Buenos Aires')">Devestate Buenos Aires</button>
        <button type="button" onclick="devestateCity(event, 'San Francisco')">Devestate San Francisco</button>
      </div>
      <br>
      Asia/Australia
      <div>
        <button type="button" id="shanghai" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Shanghai')">Start Shanghai Encounter</button>
        <button type="button" id="sydney" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Sydney')">Start Sydney Encounter</button>
        <button type="button" id="tokyo" class="encounter" onclick="startCityEncounter('Asia/Australia', 'Tokyo')">Start Tokyo Encounter</button>
      </div>
      <div class="disaster">
        <button type="button" onclick="devestateCity(event, 'Shanghai')">Devestate Shanghai</button>
        <button type="button" onclick="devestateCity(event, 'Sydney')">Devestate Sydney</button>
        <button type="button" onclick="devestateCity(event, 'Tokyo')">Devestate Tokyo</button>
      </div>
      <br>
      Europe
      <div>
        <button type="button" id="istanbul" class="encounter" onclick="startCityEncounter('Europe', 'Istanbul')">Start Istanbul Encounter</button>
        <button type="button" id="london" class="encounter" onclick="startCityEncounter('Europe', 'London')">Start London Encounter</button>
        <button type="button" id="rome" class="encounter" onclick="startCityEncounter('Europe', 'Rome')">Start Rome Encounter</button>
      </div>
      <div class="disaster">
        <button type="button" onclick="devestateCity(event, 'Istanbul')">Devestate Istanbul</button>
        <button type="button" onclick="devestateCity(event, 'London')">Devestate London</button>
        <button type="button" onclick="devestateCity(event, 'Rome')">Devestate Rome</button>
      </div>
      <br>
      Start General Encounter
      <button type="button" class="encounter" onclick="startGeneralEncounter('City')">City</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Wilderness')">Wilderness</button>
      <button type="button" class="encounter" onclick="startGeneralEncounter('Sea')">Sea</button>
      <br>
      Start Research Encounter
      <button type="button" class="encounter" onclick="startResearchEncounter('City')">City</button>
      <button type="button" class="encounter" onclick="startResearchEncounter('Wilderness')">Wilderness</button>
      <button type="button" class="encounter" onclick="startResearchEncounter('Sea')">Sea</button>
      <br>

      <div id="dreamlands">
        Start Dreamlands Encounter
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Celephaïs')">Celephaïs</button>
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Dylath-Leen')">Dylath-Leen</button>
        <button type="button" class="encounter" onclick="startCityEncounter('Dreamlands', 'Ulthar')">Ulthar</button>
        <div id="dream-quest-buttons">
          <button type="button" onclick="shuffleDreamQuestDeck()">Shuffle the Dream-Quest deck</button>
        </div>
      </div>

      <div id="cities-in-ruin">
        <div>
          <button type="button" onclick="resolveUpheavalDisaster(event)">Resolve Upheaval Disaster</button>
          <br>
        </div>
      </div>
      <button type="button" class="encounter" onclick="startOtherWorldEncounter()">Start Other World Encounter</button>

      <div id="expedition-buttons">
        <button type="button" onclick="shuffleExpeditionDeck()" id="shuffle-expedition">Shuffle the Expedition deck</button>
        <button type="button" class="encounter" onclick="resolveSecretsOfThePastReckoning()" id="secrets-of-the-past"></button>
      </div>

      <div id="crawling-chaos">
        <button type="button" onclick="putCrawlingChaosMythosIntoPlay(event)" id="add-crawling-chaos">Put 'The Crawling Chaos' Mythos card into play</button>
        <button type="button" onclick="resolveCrawlingChaosMythosReckoning()" id="resolve-crawling-chaos-reckoning">Resolve 'The Crawling Chaos' Mythos card's Reckoning effect</button>
        <button type="button" onclick="solveCrawlingChaosMythosRumor()" id="solve-crawling-chaos">Solve 'The Crawling Chaos' Rumor</button>
      </div>

      <button type="button" onclick="resolveLeopardManSpawn(event)" id="spawn-leopard-man">Resolve Leopard Man Spawn Effect</button>

      <button type="button" onclick="resolveTheWorldShakesMythos(event)">Resolve "The World Shakes" Mythos Card Effect</button>

      <div id="mystic-ruins-buttons">
        <button type="button" onclick="shuffleMysticRuinsDeck()">Shuffle the Mystic Ruins deck</button>
      </div>

      <div id="cosmic-alignment">
        <div id="cosmic-alignment-II">
          <button type="button" id="add-ruins-in-the-heart-of-the-jungle" class="cosmic-alignment-II" onclick="addRuinsInTheHeartOfTheJungle()">
            Put "Cosmic Alignment: Ruins in the Heart of the Jungle" Adventure into play
          </button>
          <button type="button" id="add-ruins-under-the-stars" class="cosmic-alignment-II" onclick="addRuinsUnderTheStars()">
            Put "Cosmic Alignment: Ruins Under the Stars" Adventure into play
          </button>
        </div>
        <button type="button" id="ruins-in-the-heart-of-the-jungle" onclick="resolveCosmicAlignmentAdventureII(event, 'Chichen Itza', 'relics-of-the-amazon')">
          Resolve "Cosmic Alignment: Ruins in the Heart of the Jungle" Adventure
        </button>
        <button type="button" id="ruins-under-the-stars" onclick="resolveCosmicAlignmentAdventureII(event, 'Stonehenge', 'relics-of-the-pyramids')">
          Resolve "Cosmic Alignment: Ruins Under the Stars" Adventure
        </button>
        <button type="button" id="relics-of-the-amazon" class="encounter" data-space="The Amazon" onclick="resolveCosmicAlignmentAdventureIII(event)">
          Resolve "Cosmic Alignment: Relics of the Amazon" Adventure
        </button>
        <button type="button" id="relics-of-the-pyramids" class="encounter" data-space="The Pyramids" onclick="resolveCosmicAlignmentAdventureIII(event)">
          Resolve "Cosmic Alignment: Relics of the Pyramids" Adventure
        </button>
      </div>

      <div id="otherworldly-dreams">
        <div id="otherworldly-dreams-III">
          <button type="button" id="add-aboard-the-black-galley" class="otherworldly-dreams-III" onclick="addOtherworldlyDreamsIIIButton('aboard-the-black-galley')">
            Put "Otherworldly Dreams: Aboard the Black Galley" Adventure into play
          </button>
          <button type="button" id="add-beyond-the-river-skai" class="otherworldly-dreams-III" onclick="addOtherworldlyDreamsIIIButton('beyond-the-river-skai')">
            Put "Otherworldly Dreams: Beyond the River Skai" Adventure into play
          </button>
          <button type="button" id="add-the-blessings-of-nodens" class="otherworldly-dreams-III" onclick="addOtherworldlyDreamsIIIButton('the-blessings-of-nodens')">
            Put "Otherworldly Dreams: The Blessings of Nodens" Adventure into play
          </button>
        </div>
        <button type="button" id="aboard-the-black-galley" onclick="resolveOtherworldlyDreamsAdventureIII(event, 'The Moon')">
          Resolve "Otherworldly Dreams: Aboard the Black Galley" Adventure
        </button>
        <button type="button" id="beyond-the-river-skai" onclick="resolveOtherworldlyDreamsAdventureIII(event, 'The Enchanted Wood')">
          Resolve "Otherworldly Dreams: Beyond the River Skai" Adventure
        </button>
        <button type="button" id="the-blessings-of-nodens" onclick="resolveOtherworldlyDreamsAdventureIII(event, 'The Underworld')">
          Resolve "Otherworldly Dreams: The Blessings of Nodens" Adventure
        </button>
      </div>

      <div id="special-encounters"></div>
    </div>
    <div>
      <h2 id>History</h2>
      <div id="history"></div>
    </div>
  </body>
</html>
