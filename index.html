<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldritch Horror Encounter Helper</title>
  </head>
  <body>
    <h1>ELDRITCH HORROR ENCOUNTER HELPER</h1>
    <div id="app"></div>
    <script src="js/index.js"></script>

    <div id="mainView">
      <select name="city" id="citySelect" onchange="citySelected()" >
        <option value="">Select a city</option>
        <option value="City">General</option>
        <optgroup label="Americas">
          <option>Arkham</option>
          <!-- <option>Buenos Aires</option> -->
          <!-- <option>San Francisco</option> -->
        </optgroup>
        <!-- <optgroup label="Europe">
          <option>Istanbul</option>
          <option>London</option>
          <option>Rome</option>
        </optgroup> -->
      </select>
      <button id="cityEncounter" type="button" disabled class="encounter" onclick="startCityEncounter(document.getElementById('citySelect').value)">Read City Encounter</button>
      <br>
      <button type="button" class="encounter" onclick="startOtherWorldEncounter()">Read Other World Encounter</button>
    </div>
    <div>
      <h2 id>Encounters</h2>
      <div id="encounterList"></div>
    </div>
  </body>
</html>
